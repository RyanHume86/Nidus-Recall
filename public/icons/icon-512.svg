    <ellipse cx="119" cy="54.2" rx="5" ry="8" fill="#101F12" stroke="#8AAD91" stroke-width="1.5" transform="rotate(-24 119 54.2)"/>
    <ellipse cx="130" cy="51.8" rx="5" ry="8" fill="#101F12" stroke="#8AAD91" stroke-width="1.5" transform="rotate(-24 130 51.8)"/>
    <ellipse cx="141" cy="49.4" rx="5" ry="8" fill="#101F12" stroke="#8AAD91" stroke-width="1.5" transform="rotate(-24 141 49.4)"/>
