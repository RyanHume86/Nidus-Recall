<!doctype html>
<html lang="en">
  <head>
    <script>
      // Suppress unhandled rejections that crash the base44 vite-plugin error handler.
      // Runs in capture phase — fires before any other listener including the vite-plugin.
      window.addEventListener('unhandledrejection', function(e) {
        var r = e.reason;
        // Always suppress: null/undefined reason crashes the handler's .match() call
        if (r == null) { e.preventDefault(); return; }
        // Suppress plain strings (no .message to inspect)
        if (typeof r === 'string') { e.preventDefault(); return; }
        // Suppress known harmless error types
        if (r instanceof DOMException) { e.preventDefault(); return; }
        if (r && (r.name === 'SecurityError' || r.name === 'AbortError' || r.name === 'NotAllowedError')) { e.preventDefault(); return; }
        // Suppress anything whose message is not a plain string (handler calls .match() on it)
        if (!r || typeof r.message !== 'string') { e.preventDefault(); return; }
        // Suppress ServiceWorker-related errors by message content
        if (r.message && (r.message.indexOf('ServiceWorker') !== -1 || r.message.indexOf('service worker') !== -1)) { e.preventDefault(); return; }
      }, true);
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#2D6E52" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nidus Recall" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Nidus Recall</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
