<!doctype html>
<html lang="en">
  <head>
    <script>
      // Narrow filter: silence only known service worker registration
      // failures with SecurityError-class errors. Everything else surfaces.
      window.addEventListener('unhandledrejection', function(e) {
        var r = e.reason;
        if (!r || typeof r !== 'object') return;
        var msg = typeof r.message === 'string' ? r.message : '';
        if (r.name === 'SecurityError' &&
            (msg.indexOf('ServiceWorker') !== -1 ||
             msg.indexOf('/sw.js') !== -1 ||
             msg.indexOf('service worker') !== -1)) {
          e.preventDefault();
        }
      }, true);
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#2D6E52" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nidus Recall" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Nidus Recall</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
