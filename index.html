<!doctype html>
<html lang="en">
  <head>
    <script>
      // Suppress SW SecurityErrors before any other listener (including vite-plugin) can see them.
      window.addEventListener('unhandledrejection', function(e) {
        var r = e.reason;
        if (r === undefined || r === null) { e.preventDefault(); return; }
        if (r instanceof DOMException || r.name === 'SecurityError') { e.preventDefault(); return; }
        if (typeof r.message !== 'string') { e.preventDefault(); }
      }, true);
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#2D6E52" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nidus Recall" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Nidus Recall</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
